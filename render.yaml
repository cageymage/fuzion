# Render Blueprint: one static site, one Docker web service, one Postgres.
# Deploy via Render dashboard -> New -> Blueprint, pointed at this repo.

services:
  - type: web
    name: fuzion-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Order matters: /api is proxied to the API service so the browser only
    # ever talks to one origin (same as the Vite proxy in local dev); anything
    # else falls through to the SPA. If Render assigned the API a different
    # hostname than fuzion-api.onrender.com, update the destination here.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fuzion-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: fuzion-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuzion-db
          property: connectionString
      # Discord OAuth app credentials; Render prompts for these on first deploy.
      # DISCORD_REDIRECT_URL must be registered on the Discord application and
      # use the hostname people actually browse the site on (the custom domain,
      # not fuzion-web.onrender.com and not the API): the OAuth state cookie is
      # per-host, so a callback on any other host fails with "state mismatch".
      # e.g. https://fuziongaming.gg/api/auth/callback
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URL
        sync: false

databases:
  - name: fuzion-db
    plan: free
    databaseName: fuzion
    user: fuzion
    postgresMajorVersion: "16"
