# Render Blueprint: one static site, one Docker web service, one Postgres.
# Deploy via Render dashboard -> New -> Blueprint, pointed at this repo.

services:
  - type: web
    name: fuzion-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Public Turnstile site key (Cloudflare dashboard > Turnstile). Baked into
      # the bundle at build time, so changing it needs a redeploy.
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    # Order matters: /api is proxied to the API service so the browser only
    # ever talks to one origin (same as the Vite proxy in local dev); anything
    # else falls through to the SPA. If Render assigned the API a different
    # hostname than fuzion-api.onrender.com, update the destination here.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fuzion-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: fuzion-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuzion-db
          property: connectionString
      # Discord OAuth app credentials; Render prompts for these on first deploy.
      # DISCORD_REDIRECT_URL must be registered on the Discord application and
      # use the hostname people actually browse the site on (the custom domain,
      # not fuzion-web.onrender.com and not the API): the OAuth state cookie is
      # per-host, so a callback on any other host fails with "state mismatch".
      # e.g. https://fuziongaming.gg/api/auth/callback
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URL
        sync: false
      # Optional: without BATTLENET_REDIRECT_URL, members cannot link a Battle.net
      # account. When it is set, BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET are
      # required too (the same Blizzard client as the roster sync). The redirect URL
      # must be registered on that client and use the host people actually browse,
      # e.g. https://fuziongaming.gg/api/auth/battlenet/callback
      - key: BATTLENET_REDIRECT_URL
        sync: false
      - key: BLIZZARD_CLIENT_ID
        sync: false
      - key: BLIZZARD_CLIENT_SECRET
        sync: false
      # Optional: without it, new applications are not announced in Discord. It is
      # a channel webhook URL (Edit Channel > Integrations > Webhooks); treat it
      # as a secret.
      - key: DISCORD_RECRUITING_WEBHOOK_URL
        sync: false
      # Optional: without it, POST /applications skips the Turnstile bot check.
      # The widget's secret key; set it only once the frontend sends tokens, or
      # every real submission is rejected.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Optional: without it, newly published news posts are not cross-posted to
      # Discord. A channel webhook URL, so treat it as a secret. When it is set,
      # SITE_BASE_URL is required or the API refuses to start.
      - key: DISCORD_ANNOUNCEMENTS_WEBHOOK_URL
        sync: false
      # Public address of the site, used for the post link in announcements. Use
      # the host people actually browse (the custom domain, not onrender.com),
      # e.g. https://fuziongaming.gg
      - key: SITE_BASE_URL
        sync: false
      # Optional: without both, the Home page has no suggested video when nobody
      # is live. The playlist must be Public or Unlisted.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_PLAYLIST_ID
        sync: false

  # Runs the same image as fuzion-api with a different command; each sync job
  # is one invocation (see backend/cmd/sync). Without the Twitch credentials the
  # job logs and exits 0.
  - type: cron
    name: fuzion-sync-twitch
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: /sync twitch
    schedule: "* * * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuzion-db
          property: connectionString
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false

  # Pulls the guild roster from Blizzard. Off until SYNC_BLIZZARD_ROSTER_ENABLED is
  # set to true, so it can be deployed before we know Blizzard serves Forever.
  - type: cron
    name: fuzion-sync-blizzard-roster
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: /sync blizzard-roster
    schedule: "0 * * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuzion-db
          property: connectionString
      - key: SYNC_BLIZZARD_ROSTER_ENABLED
        value: "false"
      - key: BLIZZARD_CLIENT_ID
        sync: false
      - key: BLIZZARD_CLIENT_SECRET
        sync: false
      - key: BLIZZARD_REGION
        value: us
      # The game version's profile namespace; Forever's is not known yet.
      - key: BLIZZARD_NAMESPACE
        sync: false
      - key: GUILD_REALM_SLUG
        sync: false
      - key: GUILD_NAME_SLUG
        sync: false

databases:
  # Deliberately not the free plan: a free database expires after 30 days, and
  # losing it would empty the users table, which hands admin to whoever signs
  # in next (the first account created is made an admin — spec §3).
  - name: fuzion-db
    plan: 0.1c-256mb
    databaseName: fuzion
    user: fuzion
    postgresMajorVersion: "16"
