# Render Blueprint: one static site, one Docker web service, one Postgres.
# Deploy via Render dashboard -> New -> Blueprint, pointed at this repo.

services:
  - type: web
    name: fuzion-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Order matters: /api is proxied to the API service so the browser only
    # ever talks to one origin (same as the Vite proxy in local dev); anything
    # else falls through to the SPA. If Render assigned the API a different
    # hostname than fuzion-api.onrender.com, update the destination here.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fuzion-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: fuzion-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuzion-db
          property: connectionString

databases:
  - name: fuzion-db
    plan: free
    databaseName: fuzion
    user: fuzion
    postgresMajorVersion: "16"
