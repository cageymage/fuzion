services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fuzion
      POSTGRES_USER: fuzion
      POSTGRES_PASSWORD: fuzion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzion -d fuzion"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
